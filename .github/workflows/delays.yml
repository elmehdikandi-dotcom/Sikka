name: Update live delays

on:
  schedule:
    - cron: "*/15 4-22 * * *"   # every 15 minutes, 05:00-23:45 in Morocco
  workflow_dispatch:             # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: sikka-data
  cancel-in-progress: false

jobs:
  delays:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Africa/Casablanca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-cloud.txt
      - name: Install tools
        run: pip install -r collector/requirements-cloud.txt
      - name: Check live delays (ONCF app service)
        run: python collector/delays_once.py
      - name: Save them
        run: |
          git config user.name "sikka-bot"
          git config user.email "sikka-bot@users.noreply.github.com"
          git add data
          git commit -m "Delays $(date +%H:%M)" || exit 0
          git pull --rebase
          git push
